name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Zulu provides Java 8 for macOS on arm64 (macos-latest), Temurin does not.
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test
        run: mvn -B -U test
      - name: Upload test reports and crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            hs_err_pid*.log
          if-no-files-found: ignore
