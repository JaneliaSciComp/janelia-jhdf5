name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    # Windows is known broken: the org.bytedeco:hdf5 preset links HDF5 statically into
    # jnihdf5.dll there (link = "libhdf5", the static library), while hdf.hdf5lib's
    # hdf5_java.dll uses hdf5.dll. The two HDF5 copies don't share IDs, so most tests fail.
    # Keep the job running for visibility, but don't let it fail the workflow until that's fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Zulu provides Java 8 for macOS on arm64 (macos-latest), Temurin does not.
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test
        run: mvn -B -U test
      - name: Upload test reports and crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            hs_err_pid*.log
          if-no-files-found: ignore
